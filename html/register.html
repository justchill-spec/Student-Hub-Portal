<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Register</title>
    <link rel="stylesheet" href="../css/register.css"> 
</head>
<body>

    <header>
        <img 
            src="../images/logo.png"
            alt="Studenthub logo"
            style="width: 100px; height: 100px;"
        >
        <h1 style="text-align: center;">Student Hub Portal</h1>
    </header>

    <h2 style="text-align: center; margin-bottom: 1.5rem; color: #35b0e4;">Student Registration Form</h2>

    <form id="studentRegistrationForm" action="../register_process.php" method="post" novalidate>
        <div class="form-group">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" maxlength="50" placeholder="Enter your full name" required>
            <span class="error-message" id="fullNameError"></span>
        </div>

        <div class="form-group">
            <label for="studentId">Student ID:</label>
            <input type="text" id="studentId" name="studentId" maxlength="20" placeholder="Enter Student ID (e.g. 25DCE012)" required>
            <span class="error-message" id="studentIdError"></span>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" maxlength="254" placeholder="student@example.com" required>
            <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" maxlength="10" required>
            <span class="error-message" id="mobileError"></span>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" maxlength="72" autocomplete="new-password" placeholder="At least 8 characters (letters, numbers, symbols)" required>
            <span class="error-message" id="passwordError"></span>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" maxlength="72" autocomplete="new-password" placeholder="Re-enter your password" required>
            <span class="error-message" id="confirmPasswordError"></span>
        </div>

        <div class="form-group">
            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="">Select Course</option>
                <option value="BCA">BCA</option>
                <option value="BSc IT">BSc IT</option>
                <option value="BBA">BBA</option>
                <option value="MBA">MBA</option>
                <option value="MCA">MCA</option>
                <option value="BTech Computer Engineering">BTech Computer Engineering</option>
            </select>
            <span class="error-message" id="courseError"></span>
        </div>

        <div class="form-group">
            <label for="year">Year:</label>
            <select id="year" name="year" required>
                <option value="">Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>
            <span class="error-message" id="yearError"></span>
        </div>

        <div class="form-group">
            <label id="genderLabel">Gender:</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="Male" required> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>
            <span class="error-message" id="genderError"></span>
        </div>

        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" id="terms" name="terms" required>
                I accept the terms and conditions.
            </label>
            <span class="error-message" id="termsError"></span>
        </div>

        <div class="button-row">
            <button type="submit" class="submit-btn">Register</button>
            <button type="reset" class="reset-btn">Reset</button>
        </div>
    </form>

    <p style="text-align: center; margin-top: 1.5rem;">
        Already have an account?
        <a href="login.php">Login</a>
    </p>

    <script src="../js/register.js"></script>

</body>
</html>
