<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Contact</title>
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body>

<!-- ===== CONTACT PAGE START ===== -->

<header>
    <img 
    src = "../images/logo.png"
    alt = "Studenthub logo"
    style="width: 100px;height: 100px;"
    href = "html/index.html">


    <h1>Student Hub Portal</h1>

    </header>

    <nav>

        <a href="assignment.html">ASSIGNMENT</a>
        <a href="attendance.html">ATTENDANCE</a>
        <a href="contact.html">CONTACT</a>
        <a href="course.html">COURSE</a>
     
        <a href="result.html">RESULT</a>
        <a href="dashboard.html">DASHBOARD</a>
        <a href="timetable.html">TIMETABLE</a>
        <a href="profile.html">PROFILE</a>
        <a href="events.html">EVENTS</a>
        
    </nav>
    <br>
  

<div class="contact-layout">
    <section class="contact" aria-labelledby="contact-title">
        <h1 id="contact-title">Contact Us</h1>

        <form id="contactForm">
            <label>Name:</label>
            <input type="text" id="contactName" placeholder="Enter Your Name">

            <label>Email:</label>
            <input type="email" id="contactEmail" placeholder="Enter Your Email">

            <label>Message:</label>
            <textarea id="message" rows="5" placeholder="Enter Your Message"></textarea>

            <button type="submit">Send</button>
        </form>
    </section>

    <aside class="faq-panel" aria-labelledby="faq-title">
        <h2 id="faq-title">Student Help Center</h2>
        <div id="contactFaqs" class="faq-accordion" aria-live="polite"></div>
    </aside>
</div>

<!-- ===== CONTACT PAGE END ===== -->


<script src="../js/contact.js"></script>
</body>
</html>
