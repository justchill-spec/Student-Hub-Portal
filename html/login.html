<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>
    <link rel="stylesheet" href="../css/login.css"> 
</head>

<body>

<!-- ===================================== -->
<!-- LOGIN PAGE START -->
<!-- ===================================== -->

<header>
    <img 
        src="../images/logo.png"
        alt="Studenthub logo"
        style="width: 100px; height: 100px;"
    >
    <h1 style="text-align: center;">Student Hub Portal</h1>
</header>

<div class="login-container">

    <h2 style="text-align: center; margin-bottom: 1.5rem; color: #35b0e4;">Student Login</h2>

    <form id="loginForm" novalidate>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter Full Name" required>
            <span class="error-message" id="nameError"></span>
        </div>

        <div class="form-group">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" name="studentId" placeholder="Enter Student ID (e.g. 25DCE012)" required>
            <span class="error-message" id="studentIdError"></span>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter Email (e.g. mukund@gmail.com)" required>
            <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" name="regPassword" placeholder="Enter Password" required>
            <span class="error-message" id="regPasswordError"></span>
        </div>

        <div class="error-message" id="loginGeneralError" style="margin-bottom: 12px; text-align: center; font-weight: 600;"></div>

        <button type="submit" class="submit-btn">Login</button>

        <div style="margin-top: 15px; padding: 10px; background: rgba(56, 189, 248, 0.1); border: 1px dashed #38bdf8; border-radius: 6px; font-size: 0.82rem; color: #cbd5e1; text-align: center;">
            <strong>Demo Credentials:</strong><br>
            Student ID: <code style="color: #38bdf8;">25DCE012</code> | Name: <code style="color: #38bdf8;">Mukund Borole</code><br>
            Email: <code style="color: #38bdf8;">mukund@gmail.com</code> | Password: <code style="color: #38bdf8;">Password@123</code>
        </div>

    </form>

    <p style="text-align: center; margin-top: 1.5rem;">
        Don't have an account?
        <a href="register.html">Register</a>
    </p>

</div>

<script src="../js/login.js"></script>

<!-- ===================================== -->
<!-- LOGIN PAGE END -->
<!-- ===================================== -->

</body>
</html>
